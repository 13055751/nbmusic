name: NBMusic
version: 1.0.0
main: com.nbmusic.NBMusicPlugin
api-version: '1.21'
description: 音符盒音乐插件——用 Minecraft 原生音符盒音色（不同材质 = 不同音色）编写与播放音乐
softdepend:
  - Eldoria
commands:
  nbm:
    description: NBMusic 主命令
    usage: /<command> <子命令>
permissions:
  nbmusic.player:
    default: true
    description: 基础玩家权限
  nbmusic.admin:
    default: op
    description: 管理权限（保存/删除歌曲）
